name: Build and publish Prism Python package

on:
  pull_request:
    paths:
      - '.github/workflows/publish-pypi.yml'
      - 'org/polypheny/prism/*.proto'
      - 'setup.py'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:
  release:
    types: [published]

env:
  VERSION: ${{ github.event.release.tag_name || '2.2' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build source distribution
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a Prism version in major.minor format: $VERSION" >&2
            exit 1
          fi
          printf '%s\n' "$VERSION" > prism-api-version.txt
          printf 'include prism-api-version.txt\n' > MANIFEST.in
          curl -fsSLO https://github.com/protocolbuffers/protobuf/releases/download/v26.0/protoc-26.0-linux-x86_64.zip
          unzip -q protoc-26.0-linux-x86_64.zip
          bin/protoc -I . --python_out . org/polypheny/prism/*.proto
          python -m pip install build
          python -m build --sdist

      - name: Install and check source distribution
        run: |
          python -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import os
          from importlib.metadata import version
          from org.polypheny.prism import namespace_meta_responses_pb2 as metadata

          assert version("polypheny-prism-api") == os.environ["VERSION"]
          assert metadata.Document.DESCRIPTOR.fields_by_name["fields"].message_type == metadata.DocumentField.DESCRIPTOR
          assert metadata.Document.DESCRIPTOR.fields_by_name["document_indexes"].message_type == metadata.DocumentIndex.DESCRIPTOR
          PY

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'release'
        with:
          name: prism-python-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prism-python-distribution
          path: dist

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
