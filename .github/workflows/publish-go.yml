name: Build and publish Prism Go archive

on:
  pull_request:
    paths:
      - '.github/workflows/publish-go.yml'
      - 'org/polypheny/prism/*.proto'
  workflow_dispatch:
  release:
    types: [published]

env:
  VERSION: ${{ github.event.release.tag_name || '2.2' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.18'
          cache: false

      - name: Build Go archive
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a Prism version in major.minor format: $VERSION" >&2
            exit 1
          fi
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.33.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          curl -fsSLO https://github.com/protocolbuffers/protobuf/releases/download/v26.0/protoc-26.0-linux-x86_64.zip
          unzip -q protoc-26.0-linux-x86_64.zip

          mkdir -p generated
          bin/protoc -I . --go_out=generated --go_opt=paths=source_relative org/polypheny/prism/*.proto
          IFS=. read -r major minor <<< "$VERSION"
          cat > generated/org/polypheny/prism/version.go <<EOF
          package prism

          // MajorVersion is the major component of the API version.
          const MajorVersion = $major

          // MinorVersion is the minor component of the API version.
          const MinorVersion = $minor
          EOF
          tar -C generated/org/polypheny -czf "go-api-files-${VERSION}.tar.gz" prism

      - name: Compile generated Go package
        run: |
          archive="$PWD/go-api-files-${VERSION}.tar.gz"
          cd "$(mktemp -d)"
          tar -xzf "$archive"
          go mod init prism-package-check
          go mod edit -require=google.golang.org/protobuf@v1.33.0
          go test -mod=mod ./prism

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'release'
        with:
          name: prism-go-archive
          path: go-api-files-${{ env.VERSION }}.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prism-go-archive

      - name: Attach Go archive to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: go-api-files-${{ env.VERSION }}.tar.gz
          fail_on_unmatched_files: true
